[package]
name = "zode_account"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

# Signing in reads the OS keychain and calls an HTTP endpoint -- real I/O
# against the real machine, which the deterministic test scheduler reports as
# non-determinism when an unrelated test pays for it. Same reasoning, and the
# same shape, as `agent_usage`'s own `test-support` feature. With this on, the
# account is built but never touches the keychain or the network at startup.
[features]
test-support = []

[lib]
path = "src/zode_account.rs"
doctest = false

[dependencies]
# Deliberately NOT `client`. That crate is shaped around the collab RPC
# connection this fork removed (`plans/260726-1531-remove-auth-cloud-hard-fork`);
# depending on it to reuse a `Status` enum would drag the whole proto surface
# back in. The overlap is one enum, and this crate writes its own.
anyhow.workspace = true
credentials_provider.workspace = true
futures.workspace = true
gpui.workspace = true
http_client.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
util.workspace = true
zed_credentials_provider.workspace = true
zed_env_vars.workspace = true

[dev-dependencies]
futures.workspace = true
serde_json.workspace = true
gpui = { workspace = true, features = ["test-support"] }
http_client = { workspace = true, features = ["test-support"] }
