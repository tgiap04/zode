dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

flutter:
  plugin:
    platforms:
      android:
        package: com.example.battery_plugin
        pluginClass: BatteryPlugin
      ios:
        pluginClass: BatteryPlugin
