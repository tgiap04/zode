[package]
name = "keep_awake"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

# No `test-support` feature, unlike `agent_usage` which has one to switch itself
# off under test. That feature exists there because `agent_usage` does its own
# I/O -- keychain, HTTP, spawning a CLI -- which the deterministic test scheduler
# reports as non-determinism. This crate's own production code reaches the OS
# only through the `Platform` trait, and every test runs against `TestPlatform`,
# so there is nothing of its own to gate off; the real shells its terminal tests
# spawn are `terminal`'s and `terminal_view`'s own I/O, exercised the same way
# their own test suites already do.

[lib]
path = "src/keep_awake.rs"
doctest = false

[dependencies]
# `agent_ui` is a deliberate dependency, unlike in `agent_usage` which avoids it
# on purpose. This crate's whole question is "is an agent tab's CLI still
# running", and `AgentView` is the only thing that knows.
agent_ui.workspace = true
fs.workspace = true
gpui.workspace = true
log.workspace = true
settings.workspace = true
# For `Terminal::pty_writes_within` -- the same output-rate question this crate
# already asks of an agent's own terminal through `agent_ui`, asked directly of
# a terminal tab instead. `agent_ui` already depends on this, so it adds no new
# cycle.
terminal.workspace = true
# For `TerminalView` and `TerminalPanel`/`TerminalPanelEvent` -- discovering and
# watching terminal tabs, centre and dock, needs both. `agent_ui` already
# depends on `terminal_view`, so it adds no new cycle here either.
terminal_view.workspace = true
ui.workspace = true
workspace.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# For `SettingsStore::test` and `update_user_settings`: the setting is a
# user-facing switch, so the tests read it through a real store rather than
# through the `try_get` fallback.
settings = { workspace = true, features = ["test-support"] }
# For the one rule the module exists to get right: a tab that is open but not
# answering must hold nothing. Proving it needs a real workspace with a real
# agent tab in it, which is why these are here and why the note at the top of
# `keep_awake_tests` no longer says the rule cannot be covered.
workspace = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
fs = { workspace = true, features = ["test-support"] }
theme = { workspace = true, features = ["test-support"] }
theme_settings = { workspace = true, features = ["test-support"] }
editor = { workspace = true, features = ["test-support"] }
# For `SpawnInTerminal` -- `a_real_dock_terminal`'s only public path to a real
# terminal in `TerminalPanel`'s own pane, since `add_terminal_shell` and its
# dock-revealing siblings are private to `terminal_view`.
task.workspace = true
