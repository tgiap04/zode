[package]
name = "database_ui"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/database_ui.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
credentials_provider.workspace = true
zode_credentials_provider.workspace = true
database = { workspace = true, features = ["client"] }
collections.workspace = true
db.workspace = true
editor.workspace = true
extension.workspace = true
fs.workspace = true
futures.workspace = true
multi_buffer.workspace = true
gpui.workspace = true
language.workspace = true
log.workspace = true
menu.workspace = true
picker.workspace = true
project.workspace = true
roxmltree.workspace = true
remote.workspace = true
rpc.workspace = true
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
terminal_view.workspace = true
ui.workspace = true
ui_input.workspace = true
util.workspace = true
workspace.workspace = true
zode_actions.workspace = true
zode_account.workspace = true
zode_env_sync.workspace = true
zode_team_vault.workspace = true
zeroize.workspace = true

[dev-dependencies]
db = { workspace = true, features = ["test-support"] }
paths.workspace = true
# Deliberately minimal, and matching what `sidebar` takes: pulling `sidebar`
# itself in here to draw the rail would drag `agent_ui` and a feature
# combination of `remote` that does not build.
theme.workspace = true
theme_settings.workspace = true
database = { workspace = true, features = ["client", "test-support"] }
gpui = { workspace = true, features = ["test-support"] }
http_client = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
fs = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
workspace = { workspace = true, features = ["test-support"] }
zode_account = { workspace = true, features = ["test-support"] }
