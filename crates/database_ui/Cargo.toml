[package]
name = "database_ui"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/database_ui.rs"

[dependencies]
anyhow.workspace = true
credentials_provider.workspace = true
zed_credentials_provider.workspace = true
database = { workspace = true, features = ["client"] }
collections.workspace = true
editor.workspace = true
extension.workspace = true
multi_buffer.workspace = true
gpui.workspace = true
menu.workspace = true
project.workspace = true
settings.workspace = true
ui.workspace = true
workspace.workspace = true
zed_actions.workspace = true

[dev-dependencies]
# Deliberately minimal, and matching what `sidebar` takes: pulling `sidebar`
# itself in here to draw the rail would drag `agent_ui` and a feature
# combination of `remote` that does not build.
theme.workspace = true
theme_settings.workspace = true
database = { workspace = true, features = ["client", "test-support"] }
gpui = { workspace = true, features = ["test-support"] }
fs = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
workspace = { workspace = true, features = ["test-support"] }
