[package]
name = "github_ui"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/github_ui.rs"

[features]
default = []
# Lets another crate's tests open the GitHub tab without a keychain, `gh` or
# the network.
test-support = ["github/test-support", "http_client/test-support"]

[dependencies]
anyhow.workspace = true
askpass.workspace = true
credentials_provider.workspace = true
editor.workspace = true
futures.workspace = true
git.workspace = true
git_ui.workspace = true
github.workspace = true
gpui.workspace = true
http_client.workspace = true
language.workspace = true
log.workspace = true
markdown.workspace = true
menu.workspace = true
project.workspace = true
pulldown-cmark.workspace = true
release_channel.workspace = true
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
time.workspace = true
time_format.workspace = true
ui.workspace = true
ui_input.workspace = true
url.workspace = true
workspace.workspace = true
zode_actions.workspace = true
zode_credentials_provider.workspace = true

[dev-dependencies]
editor = { workspace = true, features = ["test-support"] }
fs = { workspace = true, features = ["test-support"] }
github = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
http_client = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
# git_ui links it; project's test-support turns on the mock connection it must match.
remote_connection = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
theme.workspace = true
theme_settings.workspace = true
util.workspace = true
workspace = { workspace = true, features = ["test-support"] }
zlog.workspace = true
