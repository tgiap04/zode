[package]
name = "sidebar"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/sidebar.rs"

[dependencies]
container_ui.workspace = true
database_ui.workspace = true
agent_sessions.workspace = true
agent_ui.workspace = true
anyhow.workspace = true
collections.workspace = true
editor.workspace = true
gpui.workspace = true
menu.workspace = true
project.workspace = true
recent_projects.workspace = true
remote.workspace = true
remote_connection.workspace = true
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
theme.workspace = true
theme_settings.workspace = true
ui.workspace = true
util.workspace = true
workspace.workspace = true
zed_actions.workspace = true
zode_account.workspace = true
zode_account_ui.workspace = true

[dev-dependencies]
agent_ui = { workspace = true, features = ["test-support"] }
zode_account = { workspace = true, features = ["test-support"] }
# `test-support` so the rail's tests open the container tab over an engine that
# never leaves the process. Without it, pressing the button runs `docker`, whose
# exit wakes the GPUI test scheduler from a blocking thread and aborts the run.
container_ui = { workspace = true, features = ["test-support"] }
editor = { workspace = true, features = ["test-support"] }
fs = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
recent_projects = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
workspace = { workspace = true, features = ["test-support"] }
