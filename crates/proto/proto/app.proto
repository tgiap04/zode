syntax = "proto3";
package zed.messages;

message ShutdownRemoteServer {}

message Toast {
  uint64 project_id = 1;
  string notification_id = 2;
  string message = 3;
}

message HideToast {
  uint64 project_id = 1;
  string notification_id = 2;
}

message OpenServerSettings {
  uint64 project_id = 1;
}

message GetCrashFiles {}

message GetCrashFilesResponse {
  repeated CrashReport crashes = 1;
  reserved 2; // old panics
}

message CrashReport {
  reserved 1, 2;
  string metadata = 3;
  bytes minidump_contents = 4;
}

message Extension {
  string id = 1;
  string version = 2;
  bool dev = 3;
}

message SyncExtensions {
  repeated Extension extensions = 1;
}

message SyncExtensionsResponse {
  string tmp_dir = 1;
  repeated Extension missing_extensions = 2;
}

message InstallExtension {
  Extension extension = 1;
  string tmp_dir = 2;
}

message AskPassRequest {
  uint64 project_id = 1;
  reserved 2;
  uint64 repository_id = 3;
  uint64 askpass_id = 4;
  string prompt = 5;
}

message AskPassResponse {
  string response = 1;
}

message GetRemoteProfilingData {
  uint64 project_id = 1;
  bool foreground_only = 2;
}

message GetRemoteProfilingDataResponse {
  repeated RemoteProfilingThread threads = 1;
  uint64 now_nanos = 2;
}

message RemoteProfilingThread {
  optional string thread_name = 1;
  uint64 thread_id = 2;
  repeated RemoteProfilingTiming timings = 3;
}

message RemoteProfilingTiming {
  RemoteProfilingLocation location = 1;
  uint64 start_nanos = 2;
  uint64 duration_nanos = 3;
}

message RemoteProfilingLocation {
  string file = 1;
  uint32 line = 2;
  uint32 column = 3;
}

// Asks the host a project lives on for a database driver of its own: resolved
// in that host's store and environment, and downloaded for that host's
// platform when `install` is set. The client never runs a driver from its own
// machine for such a project.
message EnsureDatabaseDriver {
  uint64 project_id = 1;
  string driver_id = 2;
  bool install = 3;
  // Where the client downloads drivers from. The host checks what it fetches
  // against the signing key built into it, so this names a mirror, not a
  // trust anchor.
  string api_url = 4;
}

message EnsureDatabaseDriverResponse {
  message Installed {
    string executable = 1;
    DatabaseDriverOrigin origin = 2;
  }

  message NotInstalled {}

  message Failed {
    string reason = 1;
  }

  oneof state {
    Installed installed = 1;
    NotInstalled not_installed = 2;
    Failed failed = 3;
  }
}

// Zero is left unset, so a field nobody filled in claims nothing: the client
// reads it, and any origin it does not know, as the least privileged one.
enum DatabaseDriverOrigin {
  DATABASE_DRIVER_ORIGIN_UNSPECIFIED = 0;
  DATABASE_DRIVER_ORIGIN_BESIDE_EXECUTABLE = 1;
  DATABASE_DRIVER_ORIGIN_STORE = 2;
  DATABASE_DRIVER_ORIGIN_MANUAL = 3;
  // Named by the host's `ZODE_DB_<ID>`.
  DATABASE_DRIVER_ORIGIN_OVERRIDE = 4;
}
