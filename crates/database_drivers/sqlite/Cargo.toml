[package]
name = "zode-db-sqlite"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[[bin]]
name = "zode-db-sqlite"
path = "src/main.rs"

[dependencies]
# No `client` feature on purpose: a driver needs the protocol and the serve
# loop, and nothing that would drag gpui into a sidecar binary.
database.workspace = true
rusqlite.workspace = true
serde_json.workspace = true

[dev-dependencies]
database = { workspace = true, features = ["driver-test-suite"] }
tempfile.workspace = true
