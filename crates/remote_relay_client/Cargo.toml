[package]
name = "remote_relay_client"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[features]
# An in-process relay and an in-memory keychain, so the crates built on this
# one can drive a whole connection without a socket or a keychain.
test-support = []

[lib]
path = "src/remote_relay_client.rs"
doctest = false

[dependencies]
anyhow.workspace = true
async-tungstenite = { workspace = true, features = ["tokio", "tokio-rustls-manual-roots", "tokio-runtime"] }
base64.workspace = true
credentials_provider.workspace = true
db.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_tokio.workspace = true
http_client.workspace = true
http_client_tls.workspace = true
log.workspace = true
parking_lot.workspace = true
rand.workspace = true
release_channel.workspace = true
remote_relay_protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
smol.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "rt", "net", "macros"] }
tokio-rustls = { version = "0.26", features = ["tls12", "ring"], default-features = false }
zeroize.workspace = true
zode_account.workspace = true

[dev-dependencies]
db = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
http_client = { workspace = true, features = ["test-support"] }
remote_relay_client = { path = ".", features = ["test-support"] }
tokio = { workspace = true, features = ["time", "rt", "net", "macros", "io-util"] }
zode_account = { workspace = true, features = ["test-support"] }
