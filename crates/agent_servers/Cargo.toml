[package]
name = "agent_servers"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[features]
test-support = ["acp_tools/test-support", "acp_thread/test-support", "gpui/test-support", "project/test-support", "dep:env_logger", "client/test-support", "dep:gpui_tokio", "reqwest_client/test-support"]
e2e = []

[lints]
workspace = true

# No source references these: they are optional dependencies that exist so the
# `test-support` feature above can switch them on. cargo-machete only reads source, so it
# reports them as unused.
[package.metadata.cargo-machete]
ignored = ["env_logger", "gpui_tokio", "reqwest_client"]

[lib]
path = "src/agent_servers.rs"
doctest = false

[dependencies]
acp_tools.workspace = true
acp_thread.workspace = true
action_log.workspace = true
agent-client-protocol.workspace = true
anyhow.workspace = true
chrono.workspace = true
client.workspace = true
collections.workspace = true
env_logger = { workspace = true, optional = true }
fs.workspace = true
futures.workspace = true
gpui.workspace = true
feature_flags.workspace = true
gpui_tokio = { workspace = true, optional = true }
http_client.workspace = true
log.workspace = true
project.workspace = true
release_channel.workspace = true
remote.workspace = true
reqwest_client = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
smol.workspace = true
task.workspace = true
thiserror.workspace = true
ui.workspace = true
terminal.workspace = true
uuid.workspace = true
util.workspace = true
watch.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
nix.workspace = true

[dev-dependencies]
client = { workspace = true, features = ["test-support"] }
env_logger.workspace = true
fs.workspace = true

indoc.workspace = true
acp_thread = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
gpui_tokio.workspace = true
project = { workspace = true, features = ["test-support"] }
reqwest_client = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
# Pulled in only to pin feature unification. `project/test-support` turns on
# `remote/test-support`, which makes `RemoteConnectionIdentity::Mock` exist —
# but the arm handling it in `workspace::persistence` is gated on
# `workspace/test-support`. Enable one without the other and `workspace` fails
# to build on a non-exhaustive match. Every other crate in this repo whose test
# graph reaches both does the same.
workspace = { workspace = true, features = ["test-support"] }
