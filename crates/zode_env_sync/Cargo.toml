[package]
name = "zode_env_sync"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[features]
test-support = []

[lib]
path = "src/zode_env_sync.rs"
doctest = false

[dependencies]
# Held to the same graph rule as `zode_account` and `zode_sync`: no `client`,
# no `workspace`, no `telemetry`, no `remote*`. `script/check-account-no-telemetry`
# asserts it rather than trusting this comment.
anyhow.workspace = true
credentials_provider.workspace = true
gpui.workspace = true
http_client.workspace = true
log.workspace = true
paths.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zeroize.workspace = true
zode_account.workspace = true
zode_sync.workspace = true

[dev-dependencies]
base64.workspace = true
futures.workspace = true
gpui = { workspace = true, features = ["test-support"] }
http_client = { workspace = true, features = ["test-support"] }
zode_account = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
sha2.workspace = true
zode_sync.workspace = true
