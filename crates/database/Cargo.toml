[package]
name = "database"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/database.rs"

[features]
default = ["client"]
# Everything Zode needs to talk to a driver. Split out so a driver binary can
# depend on this crate for the protocol alone -- without it, building
# `zode-db-sqlite` would compile gpui.
client = [
    "dep:async-trait",
    "dep:collections",
    "dep:futures",
    "dep:gpui",
    "dep:parking_lot",
    "dep:smol",
    "dep:util",
]
test-support = ["client"]
# Starting a driver binary and speaking the protocol to it. std only, so a
# driver crate can take this as a dev-dependency without gpui coming with it.
driver-test-suite = []

[dependencies]
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true

async-trait = { workspace = true, optional = true }
collections = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
gpui = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
smol = { workspace = true, optional = true }
util = { workspace = true, optional = true }

[dev-dependencies]
database = { path = ".", features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
