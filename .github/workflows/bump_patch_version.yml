# Generated from xtask::workflows::bump_patch_version
# Rebuild with `cargo xtask workflows`.
name: bump_patch_version
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch name to run on
        required: true
        type: string
      prerelease:
        description: Tag as a prerelease (v0.1.2-pre) instead of a full release (v0.1.2)
        type: boolean
        default: 'false'
jobs:
  run_bump_patch_version:
    if: (github.repository_owner == 'tgiap04')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
        ref: ${{ inputs.branch }}
        token: ${{ secrets.RELEASE_TAG_TOKEN || secrets.GITHUB_TOKEN }}
    - id: bump-version
      name: bump_patch_version::run_bump_patch_version::bump_version
      run: |
        if [[ "$PRERELEASE" == "true" ]]; then
          tag_suffix="-pre"
        else
          tag_suffix=""
        fi

        which cargo-set-version > /dev/null || cargo install cargo-edit -f --no-default-features --features "set-version"
        version="$(cargo set-version -p zode --bump patch 2>&1 | sed 's/.* //')"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "tag_suffix=$tag_suffix" >> "$GITHUB_OUTPUT"
      env:
        PRERELEASE: ${{ inputs.prerelease }}
    - id: commit
      name: bump_patch_version::run_bump_patch_version::commit_changes
      uses: IAreKyleW00t/verified-bot-commit@126a6a11889ab05bcff72ec2403c326cd249b84c
      with:
        message: Bump to ${{ steps.bump-version.outputs.version }} for @${{ github.actor }}
        ref: refs/heads/${{ inputs.branch }}
        files: '**'
        token: ${{ secrets.RELEASE_TAG_TOKEN || secrets.GITHUB_TOKEN }}
    - name: bump_patch_version::run_bump_patch_version::create_version_tag
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
      with:
        script: |
          github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/v${{ steps.bump-version.outputs.version }}${{ steps.bump-version.outputs.tag_suffix }}',
              sha: '${{ steps.commit.outputs.commit }}'
          })
        github-token: ${{ secrets.RELEASE_TAG_TOKEN || secrets.GITHUB_TOKEN }}
concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash -euxo pipefail {0}
