# Generated from xtask::workflows::release
# Rebuild with `cargo xtask workflows`.
name: release
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
on:
  push:
    tags:
    - v*
jobs:
  run_tests_linux:
    if: (github.repository_owner == 'tgiap04')
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: steps::setup_cargo_config
      run: |
        mkdir -p ./../.cargo
        cp ./.cargo/ci-config.toml ./../.cargo/config.toml
    - name: steps::cache_rust_dependencies_namespace
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |-
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
    - name: steps::setup_linux
      run: ./script/linux
      timeout-minutes: 20
    - name: steps::download_wasi_sdk
      run: ./script/download-wasi-sdk
    - name: steps::setup_node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '20'
    - name: steps::cargo_install_nextest
      uses: taiki-e/install-action@921e2c9f7148d7ba14cd819f417db338f63e733c
    - name: steps::clear_target_dir_if_large
      run: ./script/clear-target-dir-if-larger-than 350 200
    - name: steps::setup_sccache
      run: ./script/setup-sccache
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        SCCACHE_BUCKET: sccache-zed
    - name: steps::cargo_nextest
      run: cargo nextest run --workspace --no-fail-fast --no-tests=warn
    - name: steps::show_sccache_stats
      run: sccache --show-stats || true
    - name: steps::cleanup_cargo_config
      if: always()
      run: |
        rm -rf ./../.cargo
    timeout-minutes: 360
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
        - 5432:5432
        options: --health-cmd pg_isready --health-interval 500ms --health-timeout 5s --health-retries 10
  clippy_linux:
    if: (github.repository_owner == 'tgiap04')
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: steps::setup_cargo_config
      run: |
        mkdir -p ./../.cargo
        cp ./.cargo/ci-config.toml ./../.cargo/config.toml
    - name: steps::cache_rust_dependencies_namespace
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |-
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
    - name: steps::setup_linux
      run: ./script/linux
      timeout-minutes: 20
    - name: steps::download_wasi_sdk
      run: ./script/download-wasi-sdk
    - name: steps::setup_sccache
      run: ./script/setup-sccache
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        SCCACHE_BUCKET: sccache-zed
    - name: steps::clippy
      run: ./script/clippy
    - name: steps::show_sccache_stats
      run: sccache --show-stats || true
    timeout-minutes: 360
  check_scripts:
    if: (github.repository_owner == 'tgiap04')
    runs-on: ubuntu-24.04
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: run_tests::check_scripts::run_shellcheck
      run: ./script/shellcheck-scripts error
    - id: get_actionlint
      name: run_tests::check_scripts::download_actionlint
      run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
    - name: run_tests::check_scripts::run_actionlint
      run: '"$ACTIONLINT_BIN" -color'
      env:
        ACTIONLINT_BIN: ${{ steps.get_actionlint.outputs.executable }}
    - name: steps::cache_rust_dependencies_namespace
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |-
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
    - name: run_tests::check_scripts::check_xtask_workflows
      run: |
        cargo xtask workflows
        if ! git diff --exit-code .github; then
          echo "Error: .github directory has uncommitted changes after running 'cargo xtask workflows'"
          echo "Please run 'cargo xtask workflows' locally and commit the changes"
          exit 1
        fi
    timeout-minutes: 360
  create_draft_release:
    if: (github.repository_owner == 'tgiap04')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
        fetch-depth: 0
        ref: ${{ github.ref }}
    - name: script/determine-release-channel
      run: script/determine-release-channel
    - name: release::create_draft_release::warn_on_version_divergence
      run: |
        # The first `version =` in the manifest is the one under [package].
        manifest_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/zed/Cargo.toml | head -1)
        if [ "$manifest_version" = "$RELEASE_VERSION" ]; then
            echo "tag and crates/zed/Cargo.toml agree on ${RELEASE_VERSION}"
        else
            echo "::warning::tag ${GITHUB_REF_NAME} builds as ${RELEASE_VERSION} but crates/zed/Cargo.toml says ${manifest_version}; the binary reports the tag, so consider bumping the manifest to match"
        fi
    - name: mkdir -p target/
      run: mkdir -p target/
    - name: release::create_draft_release::generate_release_notes
      run: |
        prior_tag=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
        {
            if [ -n "$prior_tag" ]; then
                git log --no-merges --pretty='- %s' "${prior_tag}..${GITHUB_REF_NAME}"
                echo
                echo "**Full changelog**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${prior_tag}...${GITHUB_REF_NAME}"
            else
                echo "- First release."
            fi
            echo
            echo "Not code-signed. See the README before installing."
        } > target/release-notes.md
        cat target/release-notes.md
    - name: release::create_draft_release::create_release
      run: script/create-draft-release target/release-notes.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 360
  bundle_linux_aarch64:
    runs-on: ubuntu-24.04-arm
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: none
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      CARGO_PROFILE_RELEASE_LTO: 'false'
      ZED_CLIENT_CHECKSUM_SEED: ${{ secrets.ZED_CLIENT_CHECKSUM_SEED }}
      ZED_MINIDUMP_ENDPOINT: ${{ secrets.ZED_SENTRY_MINIDUMP_ENDPOINT }}
      CC: clang
      CXX: clang++
      DEBIAN_FRONTEND: noninteractive
    steps:
    - name: steps::bootstrap_container
      run: |
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl git
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: script/determine-release-channel
      run: script/determine-release-channel
    - name: steps::free_disk_space
      run: |
        rm -rf /__t/CodeQL || true
        df -h /
    - name: steps::setup_linux
      run: ./script/linux
      timeout-minutes: 20
    - name: steps::download_wasi_sdk
      run: ./script/download-wasi-sdk
    - name: ./script/bundle-linux
      run: ./script/bundle-linux
    - name: run_bundling::bundle_linux::check_glibc_floor
      run: ./script/check-glibc-floor target/release/zode-linux-aarch64.tar.gz
    - name: '@actions/upload-artifact zode-linux-aarch64.tar.gz'
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
      with:
        name: zode-linux-aarch64.tar.gz
        path: target/release/zode-linux-aarch64.tar.gz
        if-no-files-found: error
    container:
      image: ubuntu:22.04
    timeout-minutes: 360
  bundle_linux_x86_64:
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: none
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      CARGO_PROFILE_RELEASE_LTO: 'false'
      ZED_CLIENT_CHECKSUM_SEED: ${{ secrets.ZED_CLIENT_CHECKSUM_SEED }}
      ZED_MINIDUMP_ENDPOINT: ${{ secrets.ZED_SENTRY_MINIDUMP_ENDPOINT }}
      CC: clang
      CXX: clang++
      DEBIAN_FRONTEND: noninteractive
    steps:
    - name: steps::bootstrap_container
      run: |
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl git
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: script/determine-release-channel
      run: script/determine-release-channel
    - name: steps::free_disk_space
      run: |
        rm -rf /__t/CodeQL || true
        df -h /
    - name: steps::setup_linux
      run: ./script/linux
      timeout-minutes: 20
    - name: steps::download_wasi_sdk
      run: ./script/download-wasi-sdk
    - name: ./script/bundle-linux
      run: ./script/bundle-linux
    - name: run_bundling::bundle_linux::check_glibc_floor
      run: ./script/check-glibc-floor target/release/zode-linux-x86_64.tar.gz
    - name: '@actions/upload-artifact zode-linux-x86_64.tar.gz'
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
      with:
        name: zode-linux-x86_64.tar.gz
        path: target/release/zode-linux-x86_64.tar.gz
        if-no-files-found: error
    container:
      image: ubuntu:22.04
    timeout-minutes: 360
  bundle_mac_aarch64:
    runs-on: macos-15
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: none
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      CARGO_PROFILE_RELEASE_LTO: 'false'
      ZED_CLIENT_CHECKSUM_SEED: ${{ secrets.ZED_CLIENT_CHECKSUM_SEED }}
      ZED_MINIDUMP_ENDPOINT: ${{ secrets.ZED_SENTRY_MINIDUMP_ENDPOINT }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: script/determine-release-channel
      run: script/determine-release-channel
    - name: steps::setup_node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '20'
    - name: steps::free_disk_space
      run: |
        sudo rm -rf /Applications/Xcode_15*.app
        df -h /
    - name: run_bundling::bundle_mac::bundle_mac
      run: ./script/bundle-mac aarch64-apple-darwin
    - name: '@actions/upload-artifact Zode-aarch64.dmg'
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
      with:
        name: Zode-aarch64.dmg
        path: target/aarch64-apple-darwin/release/Zode-aarch64.dmg
        if-no-files-found: error
    timeout-minutes: 360
  bundle_mac_x86_64:
    runs-on: macos-15-intel
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: none
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      CARGO_PROFILE_RELEASE_LTO: 'false'
      ZED_CLIENT_CHECKSUM_SEED: ${{ secrets.ZED_CLIENT_CHECKSUM_SEED }}
      ZED_MINIDUMP_ENDPOINT: ${{ secrets.ZED_SENTRY_MINIDUMP_ENDPOINT }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: script/determine-release-channel
      run: script/determine-release-channel
    - name: steps::setup_node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '20'
    - name: steps::free_disk_space
      run: |
        sudo rm -rf /Applications/Xcode_15*.app
        df -h /
    - name: run_bundling::bundle_mac::bundle_mac
      run: ./script/bundle-mac x86_64-apple-darwin
    - name: '@actions/upload-artifact Zode-x86_64.dmg'
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
      with:
        name: Zode-x86_64.dmg
        path: target/x86_64-apple-darwin/release/Zode-x86_64.dmg
        if-no-files-found: error
    timeout-minutes: 360
  bundle_windows_aarch64:
    runs-on: windows-2025
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: none
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      CARGO_PROFILE_RELEASE_LTO: 'false'
      ZED_CLIENT_CHECKSUM_SEED: ${{ secrets.ZED_CLIENT_CHECKSUM_SEED }}
      ZED_MINIDUMP_ENDPOINT: ${{ secrets.ZED_SENTRY_MINIDUMP_ENDPOINT }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
      ACCOUNT_NAME: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
      CERT_PROFILE_NAME: ${{ vars.AZURE_SIGNING_CERT_PROFILE_NAME }}
      ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      FILE_DIGEST: SHA256
      TIMESTAMP_DIGEST: SHA256
      TIMESTAMP_SERVER: http://timestamp.acs.microsoft.com
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: script/determine-release-channel.ps1
      run: script/determine-release-channel.ps1
      shell: pwsh
      working-directory: ${{ env.ZED_WORKSPACE }}
    - name: steps::free_disk_space
      run: |
        Remove-Item -Recurse -Force "C:\Android" -ErrorAction SilentlyContinue
        Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize
      shell: pwsh
    - name: steps::windows_enable_long_paths
      run: |
        git config --global core.longpaths true
        New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force | Out-Null
      shell: pwsh
    - name: run_bundling::bundle_windows::bundle_windows
      run: script/bundle-windows.ps1 -Architecture aarch64
      shell: pwsh
    - name: '@actions/upload-artifact Zode-aarch64.exe'
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
      with:
        name: Zode-aarch64.exe
        path: target/Zode-aarch64.exe
        if-no-files-found: error
    timeout-minutes: 360
  bundle_windows_x86_64:
    runs-on: windows-2025
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: none
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      CARGO_PROFILE_RELEASE_LTO: 'false'
      ZED_CLIENT_CHECKSUM_SEED: ${{ secrets.ZED_CLIENT_CHECKSUM_SEED }}
      ZED_MINIDUMP_ENDPOINT: ${{ secrets.ZED_SENTRY_MINIDUMP_ENDPOINT }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
      ACCOUNT_NAME: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
      CERT_PROFILE_NAME: ${{ vars.AZURE_SIGNING_CERT_PROFILE_NAME }}
      ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      FILE_DIGEST: SHA256
      TIMESTAMP_DIGEST: SHA256
      TIMESTAMP_SERVER: http://timestamp.acs.microsoft.com
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: script/determine-release-channel.ps1
      run: script/determine-release-channel.ps1
      shell: pwsh
      working-directory: ${{ env.ZED_WORKSPACE }}
    - name: steps::free_disk_space
      run: |
        Remove-Item -Recurse -Force "C:\Android" -ErrorAction SilentlyContinue
        Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize
      shell: pwsh
    - name: steps::windows_enable_long_paths
      run: |
        git config --global core.longpaths true
        New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force | Out-Null
      shell: pwsh
    - name: run_bundling::bundle_windows::bundle_windows
      run: script/bundle-windows.ps1 -Architecture x86_64
      shell: pwsh
    - name: '@actions/upload-artifact Zode-x86_64.exe'
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
      with:
        name: Zode-x86_64.exe
        path: target/Zode-x86_64.exe
        if-no-files-found: error
    timeout-minutes: 360
  upload_release_assets:
    needs:
    - create_draft_release
    - run_tests_linux
    - clippy_linux
    - check_scripts
    - bundle_linux_aarch64
    - bundle_linux_x86_64
    - bundle_mac_aarch64
    - bundle_mac_x86_64
    - bundle_windows_aarch64
    - bundle_windows_x86_64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: release::download_workflow_artifacts
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        path: ./artifacts/
    - name: ls -lR ./artifacts
      run: ls -lR ./artifacts
    - name: release::prep_release_artifacts
      run: |-
        mkdir -p release-artifacts/

        mv ./artifacts/Zode-aarch64.dmg/Zode-aarch64.dmg release-artifacts/Zode-aarch64.dmg
        mv ./artifacts/Zode-x86_64.dmg/Zode-x86_64.dmg release-artifacts/Zode-x86_64.dmg
        mv ./artifacts/zode-linux-aarch64.tar.gz/zode-linux-aarch64.tar.gz release-artifacts/zode-linux-aarch64.tar.gz
        mv ./artifacts/zode-linux-x86_64.tar.gz/zode-linux-x86_64.tar.gz release-artifacts/zode-linux-x86_64.tar.gz
        mv ./artifacts/Zode-x86_64.exe/Zode-x86_64.exe release-artifacts/Zode-x86_64.exe
        mv ./artifacts/Zode-aarch64.exe/Zode-aarch64.exe release-artifacts/Zode-aarch64.exe
    - name: gh release upload "$GITHUB_REF_NAME" --repo="$GITHUB_REPOSITORY" release-artifacts/*
      run: gh release upload "$GITHUB_REF_NAME" --repo="$GITHUB_REPOSITORY" release-artifacts/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  validate_release_assets:
    needs:
    - upload_release_assets
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: release::validate_release_assets
      run: |
        EXPECTED_ASSETS='["Zode-aarch64.dmg", "Zode-x86_64.dmg", "zode-linux-aarch64.tar.gz", "zode-linux-x86_64.tar.gz", "Zode-x86_64.exe", "Zode-aarch64.exe"]'
        TAG="$GITHUB_REF_NAME"

        ACTUAL_ASSETS=$(gh release view "$TAG" --repo="$GITHUB_REPOSITORY" --json assets -q '[.assets[].name]')

        if [ -z "$ACTUAL_ASSETS" ]; then
            echo "Error: could not read release $TAG. It exists only as a draft until someone"
            echo "publishes it, and a draft is invisible to a token without write on contents."
            exit 1
        fi

        MISSING_ASSETS=$(echo "$EXPECTED_ASSETS" | jq -r --argjson actual "$ACTUAL_ASSETS" '. - $actual | .[]')

        if [ -n "$MISSING_ASSETS" ]; then
            echo "Error: The following assets are missing from the release:"
            echo "$MISSING_ASSETS"
            exit 1
        fi

        echo "All expected assets are present in the release."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'main' && github.sha || 'anysha' }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash -euxo pipefail {0}
