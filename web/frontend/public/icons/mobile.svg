<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Device Frame -->
  <rect x="12" y="4" width="24" height="40" rx="6" fill="#18181B" stroke="#EC4899" stroke-width="1.5" />
  <!-- Speaker / Notch -->
  <line x1="20" y1="8" x2="28" y2="8" stroke="#71717A" stroke-width="1.5" stroke-linecap="round" />
  <!-- Screen -->
  <rect x="15" y="12" width="18" height="24" rx="2" fill="#27272A" />
  <!-- App Grid on Screen -->
  <rect x="17" y="15" width="4" height="4" rx="1" fill="#EC4899" />
  <rect x="23" y="15" width="4" height="4" rx="1" fill="#F43F5E" />
  <rect x="27" y="15" width="4" height="4" rx="1" fill="#FB7185" />
  <rect x="17" y="21" width="4" height="4" rx="1" fill="#38BDF8" />
  <rect x="23" y="21" width="4" height="4" rx="1" fill="#A855F7" />
  <rect x="27" y="21" width="4" height="4" rx="1" fill="#10B981" />
  <!-- Home Indicator -->
  <line x1="20" y1="40" x2="28" y2="40" stroke="#EC4899" stroke-width="1.5" stroke-linecap="round" />
</svg>
